<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Agent Chat Demo</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --card: #ffffff;
      --line: #d8dee7;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --accent-dark: #0b5f58;
      --user: #dff7f3;
      --assistant: #ffffff;
      --debug: #0f172a;
      --debug-text: #d1fae5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #edf6f5 0%, var(--bg) 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 20px;
      min-height: 100vh;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
    }
    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 48px);
      overflow: hidden;
    }
    .header {
      padding: 20px 22px 12px;
      border-bottom: 1px solid var(--line);
    }
    .header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }
    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items: center;
    }
    label {
      font-size: 13px;
      color: var(--muted);
    }
    input[type="text"], input[type="number"] {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      width: 180px;
      background: #fff;
    }
    input[type="number"] {
      width: 80px;
    }
    .preset-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .preset-btn {
      background: #eef2f7;
      color: #374151;
      border: 1px solid #d6dde8;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .preset-btn:hover {
      background: #e5edf7;
    }
    .messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bubble {
      max-width: 92%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      white-space: pre-wrap;
      line-height: 1.8;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }
    .user {
      align-self: flex-end;
      background: var(--user);
    }
    .assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .role {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .composer {
      border-top: 1px solid var(--line);
      padding: 16px;
      background: #fafcfd;
    }
    textarea {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      background: white;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status {
      color: var(--muted);
      font-size: 14px;
    }
    button.primary {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }
    button.primary:hover {
      background: var(--accent-dark);
    }
    button.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .debug-panel {
      padding: 18px;
      overflow: auto;
      min-height: calc(100vh - 48px);
    }
    .debug-panel h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    .state-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .kv {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fafbfc;
    }
    .kv .k {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .kv .v {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    details {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    summary {
      cursor: pointer;
      font-weight: 700;
    }
    pre {
      background: var(--debug);
      color: var(--debug-text);
      border-radius: 14px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 12px;
    }
    ul {
      padding-left: 18px;
      margin: 12px 0 0;
    }
    li {
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 980px) {
      .wrap {
        grid-template-columns: 1fr;
      }
      .chat-panel, .debug-panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel chat-panel">
      <div class="header">
        <h1>Policy Agent Chat Demo</h1>
        <p>现在可以直接用同一个 session 做多轮验证，例如：先问上海，再追问“那北京呢”“第二篇呢”“继续讲支持重点”。</p>
        <div class="toolbar">
          <label>Session ID
            <input id="sessionId" type="text" value="demo-session">
          </label>
          <label>Top K
            <input id="topK" type="number" min="1" max="20" value="5">
          </label>
        </div>
        <div class="preset-row">
          <button class="preset-btn" data-query="总结一下上海的AI政策">上海汇总</button>
          <button class="preset-btn" data-query="那北京呢">那北京呢</button>
          <button class="preset-btn" data-query="比较北京和上海的大模型政策">北京上海对比</button>
          <button class="preset-btn" data-query="继续讲支持重点">继续讲支持重点</button>
          <button class="preset-btn" data-query="第二篇呢">第二篇呢</button>
        </div>
      </div>

      <div id="messages" class="messages">
        <div class="empty">这里会显示连续对话内容。</div>
      </div>

      <div class="composer">
        <textarea id="query" placeholder="输入问题，例如：总结一下上海的AI政策"></textarea>
        <div class="composer-actions">
          <div id="status" class="status">等待输入。</div>
          <button id="askBtn" class="primary">发送</button>
        </div>
      </div>
    </section>

    <aside class="panel debug-panel">
      <h2>调试面板</h2>
      <div id="stateGrid" class="state-grid"></div>

      <details open>
        <summary>引用</summary>
        <ul id="citations"></ul>
        <div id="emptyCitations" class="empty">这里会显示本轮引用证据。</div>
      </details>

      <details>
        <summary>Session Memory</summary>
        <pre id="memoryJson">{}</pre>
      </details>

      <details>
        <summary>完整状态 JSON</summary>
        <pre id="rawJson">{}</pre>
      </details>
    </aside>
  </div>

  <script>
    const queryInput = document.getElementById("query");
    const sessionIdInput = document.getElementById("sessionId");
    const topKInput = document.getElementById("topK");
    const askBtn = document.getElementById("askBtn");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const stateGrid = document.getElementById("stateGrid");
    const citationsEl = document.getElementById("citations");
    const emptyCitationsEl = document.getElementById("emptyCitations");
    const rawJsonEl = document.getElementById("rawJson");
    const memoryJsonEl = document.getElementById("memoryJson");

    const stateKeys = [
      ["resolved_action", "Resolved Action"],
      ["response_mode", "Response Mode"],
      ["retrieval_goal", "Retrieval Goal"],
      ["focus", "Focus"],
      ["intent", "Intent"],
      ["route", "Route"],
      ["strategy", "Strategy"],
      ["planner_source", "Planner"],
      ["rewrite_source", "Rewrite"],
      ["answer_source", "Answer"],
      ["judge_source", "Judge"],
      ["judge_verdict", "Verdict"],
      ["next_step_source", "Next Step"],
      ["next_step_action", "Action"],
      ["contextualized_query", "Context Query"],
    ];

    const messages = [];

    function renderMessages() {
      messagesEl.innerHTML = "";
      if (messages.length === 0) {
        messagesEl.innerHTML = '<div class="empty">这里会显示连续对话内容。</div>';
        return;
      }

      messages.forEach((item) => {
        const div = document.createElement("div");
        div.className = `bubble ${item.role}`;
        div.innerHTML = `<div class="role">${item.role === "user" ? "User" : "Assistant"}</div>${escapeHtml(item.content)}`;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderState(data) {
      stateGrid.innerHTML = "";
      stateKeys.forEach(([key, label]) => {
        const div = document.createElement("div");
        div.className = "kv";
        div.innerHTML = `<div class="k">${label}</div><div class="v">${data[key] ?? "-"}</div>`;
        stateGrid.appendChild(div);
      });
    }

    function renderCitations(citations) {
      citationsEl.innerHTML = "";
      if (!citations || citations.length === 0) {
        emptyCitationsEl.style.display = "block";
        return;
      }
      emptyCitationsEl.style.display = "none";
      citations.forEach((item) => {
        const li = document.createElement("li");
        const title = item.title || item.doc_id || "unknown";
        const path = item.title_path_str ? ` | ${item.title_path_str}` : "";
        const text = item.text || "";
        li.textContent = `${title}${path}：${text}`;
        citationsEl.appendChild(li);
      });
    }

    async function ask() {
      const query = queryInput.value.trim();
      const topK = Number(topKInput.value || 5);
      if (!query) {
        statusEl.textContent = "请输入问题。";
        return;
      }

      messages.push({ role: "user", content: query });
      renderMessages();
      queryInput.value = "";
      askBtn.disabled = true;
      statusEl.textContent = "正在分析，请稍候…";
      rawJsonEl.textContent = "{}";
      memoryJsonEl.textContent = "{}";
      citationsEl.innerHTML = "";
      emptyCitationsEl.style.display = "block";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            top_k: topK,
            session_id: sessionIdInput.value.trim() || "demo-session",
          }),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "请求失败");
        }

        const finalResponse = data.final_response || {};
        messages.push({
          role: "assistant",
          content: finalResponse.message || "未返回最终回答。",
        });
        renderMessages();
        renderState(data);
        renderCitations(finalResponse.citations || []);
        rawJsonEl.textContent = JSON.stringify(data, null, 2);
        memoryJsonEl.textContent = JSON.stringify(data.session_memory || {}, null, 2);
        statusEl.textContent = "分析完成。";
      } catch (error) {
        messages.push({
          role: "assistant",
          content: `执行失败：${error.message}`,
        });
        renderMessages();
        statusEl.textContent = `执行失败：${error.message}`;
      } finally {
        askBtn.disabled = false;
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\n/g, "<br>");
    }

    askBtn.addEventListener("click", ask);
    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        ask();
      }
    });

    document.querySelectorAll(".preset-btn").forEach((button) => {
      button.addEventListener("click", () => {
        queryInput.value = button.dataset.query;
      });
    });
  </script>
</body>
</html>
